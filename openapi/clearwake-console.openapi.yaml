                    state: VERIFIED
                    action: settle_by_offer
                    detail: 'Settled at INQUIRY: PayPal shows RESOLVED (RESOLVED_WITH_PAYOUT) at the INQUIRY stage, never a claim.'
                    note: The buyer accepted the offer (the local provider records it; in the sandbox the buyer accepts in PayPal's Resolution Center).
                  dispute_id: PP-D-REH-94816C42B4
                  reason: MERCHANDISE_OR_SERVICE_NOT_AS_DESCRIBED
                  amount_minor: 250
                  capture: CAP-N-b38ce4
                  capture_minor: 900
                  customer: buyer-n-b38ce4
                  order: ORDER-N-b38ce4
                  due: '2026-11-21T07:17:29.805243Z'
                  message: The colour is wrong.
                  use_trackers: false
                  receipt_digest: null
                  deadline: &id003
                    seconds_left: 863999
                    state: ok
                  sources: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      externalDocs:
        description: See this call in the Clearwake console
        url: https://clearwake-console.onrender.com/console
  /console/api/approve:
    post:
      tags:
      - Merchant agent
      operationId: approve
      summary: Approve a held action
      description: Records a named person's approval for the approval id in the inbox, then runs the case again so the agent takes only the step the approval names. The approval store refuses a decided, expired or self approval.
      security:
      - consoleSession: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
            example:
              approval_id: 00000000-0000-0000-0000-000000000000
              approver: Sri B
        description: The approval id and the approver's name.
      responses:
        '200':
          description: The updated case entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
              example: *id001
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      externalDocs:
        description: See this call in the Clearwake console
        url: https://clearwake-console.onrender.com/console
  /console/api/reconcile:
    post:
      tags:
      - Merchant agent
      operationId: reconcile
      summary: Reconcile an UNKNOWN refund from the provider record
      description: Reads the provider's refund for the case's stable request id and checks amount, currency and status. Nothing is sent again. Only a refund in state UNKNOWN is reconciled.
      security:
      - consoleSession: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileRequest'
            example:
              case_id: PP-D-REH-BE1428B853
        description: The case id whose UNKNOWN refund is read back from the provider.
      responses:
        '200':
          description: The updated case entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
              example: *id001
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      externalDocs:
        description: See this call in the Clearwake console
        url: https://clearwake-console.onrender.com/console
  /console/api/reset:
    post:
      tags:
      - Run
      operationId: reset
      summary: Start a fresh run
      description: Opens a new data folder. Locally earlier folders are kept; in hosted mode they are deleted (`wiped`, `removed_folders`).
      security:
      - consoleSession: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: An empty JSON object. The route takes no fields.
            example: {}
        description: An empty JSON object.
      responses:
        '200':
          description: A new run folder is open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetResult'
              example:
                ok: true
                folder: run-20261111-104352-aecb
                wiped: false
                removed_folders: 0
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      externalDocs:
        description: See this call in the Clearwake console
        url: https://clearwake-console.onrender.com/console
  /console/api/negotiation:
    get:
      tags:
      - Merchant agent
      operationId: getNegotiation
      summary: Steps of the running or last negotiation
      description: The steps of the negotiation started by `negotiate`, read from the merchant's signed receipt log as it grows. Each step is a receipt that was really written.
      responses:
        '200':
          description: Negotiation state and its steps so far.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Negotiation'
              example:
                running: false
                error: null
                case: PP-D-REH-49D4D35C16
                steps:
                - n: 1
                  step: PP-D-REH-49D4D35C16:decision
                  action: clearwake.dispute.decision
                  ok: true
                  at: 05:05:48
                - n: 2
                  step: PP-D-REH-49D4D35C16:offer
                  action: clearwake.dispute.offer_sent
                  ok: true
                  at: 05:05:48
                - n: 3
                  step: PP-D-REH-49D4D35C16:settlement
                  action: clearwake.dispute.settlement
                  ok: false
                  at: 05:05:48
                - n: 4
                  step: PP-D-REH-49D4D35C16:settlement
                  action: clearwake.dispute.settlement
                  ok: true
                  at: 05:05:48
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      externalDocs:
        description: See this call in the Clearwake console
        url: https://clearwake-console.onrender.com/console
  /console/api/totals:
    get:
      tags:
      - Ledger and receipts
      operationId: getTotals
      summary: Measured numbers for the console header
      description: The few measured numbers built from the run files in data/runs/, each with the file it came from. An empty list when site/data/totals.json is absent.
      responses:
        '200':
          description: Measured numbers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Total'
                description: The list of measured numbers.
              example:
              - value: 5 of 10
                label: disputes settled at INQUIRY, before a claim
                source: data/runs/batch-local-20261110-223520.json
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      externalDocs:
        description: See this call in the Clearwake console
        url: https://clearwake-console.onrender.com/console
  /console/api/negotiate:
    post:
      tags:
      - Merchant agent
      operationId: negotiate
      summary: Start one negotiation in the background
      description: Runs case n (offer, buyer accepts, PayPal shaped record read back) on the local provider in the background. Read progress with `getNegotiation`. Only one runs at a time.
      security:
      - consoleSession: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: An empty JSON object. The route takes no fields.
            example: {}
        description: An empty JSON object.
      responses:
        '200':
          description: The negotiation started.
          content:
            application/json:
              schema:
                type: object
                required:
                - started
                - from
                properties:
                  started:
                    type: boolean
                    description: True when the negotiation was started.
                    example: true
                  from:
                    type: integer
                    description: Line count of the merchant receipt log when the negotiation began.
                    example: 52
                example:
                  started: true
                  from: 52
                description: Whether the negotiation started, and the receipt log line count when it began.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      externalDocs:
        description: See this call in the Clearwake console
        url: https://clearwake-console.onrender.com/console
  /healthz:
    get:
      tags:
      - Health
      operationId: getHealth
      summary: Check that the service is awake
      description: 'Returns `{"ok": true}`. No session, no origin check, never rate limited. Render uses it as its health check and a keep-warm monitor pings it every few minutes.'
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                ok: true
      externalDocs:
        description: See this call in the Clearwake console
        url: https://clearwake-console.onrender.com/console
  /console/api/rules/propose:
    post:
      tags:
      - Rules
      operationId: proposeRules
      summary: Turn a sentence into rules and read them back
      description: Parses a plain sentence into the refund rules and returns them in words with a before and after table. Nothing changes until `confirmRules` is called with the returned `rules_hash`. The hard ceiling of $100.00 per refund cannot be raised by any sentence.
      security: &id002
      - consoleSession: []
        csrfToken: []
      requestBody:
        required: true
        description: The sentence and whose rules they are.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesProposeRequest'
            example:
              text: Refund up to 5 dollars when the parcel is lost
              role: merchant
      responses:
        '200':
          description: The rules in words, ready to confirm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesProposal'
              example:
                role: merchant
                status: rule_parser
                label: rule parser, not AI
                question: ''
                changes:
                - 'no day count in the sentence: kept 10 days'
                rejected: []
                latency_ms: -1
                attempts: 0
                sentence_sha256: ee3f044b33e961e086bbd54e5f2a17ff052f0a7e705ce5f917d5d09608c3d53c
                model: rule parser
                backend: rule_parser
                ok: true
                readback:
                - Refunds up to $5.00 are made without asking you.
                - 'Anything above $5.00 is not refunded by the agent: it comes to you with the evidence ready.'
                - An order counts as not arrived after 10 days without delivery.
                - The same order is never refunded twice. This is always on in code.
                - 'Disputes fought with evidence: item not received. Every other kind comes to you.'
                - 'US dollars only. Hard ceiling in code: $100.00 per refund. No sentence can raise it.'
                diff:
                - field: Most the agent may refund
                  before: $5.00
                  after: $5.00
                  changed: false
                - field: Approval needed above
                  before: $2.00
                  after: $5.00
                  changed: true
                - field: Days until not arrived
                  before: '10'
                  after: '10'
                  changed: false
                - field: Fought with evidence
                  before: item not received
                  after: item not received
                  changed: false
                rules_hash: 60904ab97652ddc3692a557879844ae9cd949010d18372baa83ec7bcda755d7d
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      externalDocs:
        description: See this call in the Clearwake console
        url: https://clearwake-console.onrender.com/console
  /console/api/rules/confirm:
    post:
      tags:
      - Rules
      operationId: confirmRules
      summary: Confirm the rules that were read back
      description: Signs and applies the rules last returned by `proposeRules` for the role. The hash must match the pending proposal; otherwise the call is refused with 409 and nothing changes.
      security: *id002
      requestBody:
        required: true
        description: The role and the `rules_hash` from the read back.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesConfirmRequest'
            example:
              role: merchant
              rules_hash: 60904ab97652ddc3692a557879844ae9cd949010d18372baa83ec7bcda755d7d
      responses:
        '200':
          description: The rules are signed and in force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesConfirmed'
              example:
                role: merchant
                rules_hash: 60904ab97652ddc3692a557879844ae9cd949010d18372baa83ec7bcda755d7d
                policy_hash: 7889498f53fe2a84409a9030733cb326fb9f8b662e9c243f9bf6b0c3489581ec
                previous_kept: true
                source: typed
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The rules on screen are not the ones waiting for confirmation. Propose them again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: The rules on screen are not the ones waiting for confirmation. Turn the sentence into rules again.
        '429':
          $ref: '#/components/responses/RateLimited'
      externalDocs:
        description: See this call in the Clearwake console
        url: https://clearwake-console.onrender.com/console
  /console/api/voice/status:
    get:
      tags:
      - Voice
      operationId: getVoiceStatus
      summary: Is speech to text available on this server
      description: Reports whether the local speech model and ffmpeg are present, the recording limits and the intents the assistant understands. Typing always works.
      responses:
        '200':
          description: Voice status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceStatus'
              example:
                stt: true
                model: small.en
                ffmpeg: true
                model_present: true
                max_seconds: 30
                max_bytes: 5242880
                label: 'speech to text: Whisper small.en on this machine (int8, CPU), no cloud service'
                tts: the browser's own speech synthesis on your device
                typing: true
                intents:
                - set_rules
                - ask
                - approve
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      externalDocs:
        description: See this call in the Clearwake console
        url: https://clearwake-console.onrender.com/console
  /console/api/voice/turn:
    post:
      tags:
      - Voice
      operationId: voiceTurn
      summary: Send one typed or spoken sentence, get one answer
      description: Send either `text` or the `transcript_id` returned by `transcribeVoice`. The assistant answers a question from the records, proposes rules (then `needs_confirm` is true and a `token` is returned for `answerVoice`), or says it did not understand. The text shown is the text spoken.
      security: *id002
      requestBody:
        required: true
        description: Typed text, or the id of a transcript held on the server.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceTurnRequest'
            example:
              text: what happened with my disputes
      responses:
        '200':
          description: One answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceReply'
              example:
                intent: ask
                source: typed
                transcript: what happened with my disputes
                transcript_sha256: d3e83ba34c310d83d205eed5e026bee14d33364c31f1082d8a6536f819dac8f0
                text: There are no disputes today on the records.
                speak: There are no disputes today on the records.
                needs_confirm: false
                token: null
                how: matcher
                facts:
                  disputes: 0
                  closed: 0
                  with_owner: 0
                  scope: today
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      externalDocs:
        description: See this call in the Clearwake console
        url: https://clearwake-console.onrender.com/console
  /console/api/voice/answer:
    post:
      tags:
      - Voice
      operationId: answerVoice
      summary: Tap Yes or No on the question waiting
      description: Has the same effect as saying yes or no to the one question on screen. The `token` comes from the `voiceTurn` answer that asked. A stale token gets a reply with `stale` true and changes nothing.
      security: *id002
      requestBody:
        required: true
        description: The token of the open question and the answer.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceAnswerRequest'
            example:
              token: 1dd2bbc8054b9b8aed09fedc
              answer: 'yes'
      responses:
        '200':
          description: The effect of the answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceReply'
              example:
                intent: 'yes'
                source: tap
                transcript: ''
                transcript_sha256: 93c625dd555bff5f0d1f8894e90674f4ee390d4bf53f437858c1208755a03fd2
                text: Nothing is waiting for a yes or a no. Say a rule, a question, or an approval.
                speak: Nothing is waiting for a yes or a no. Say a rule, a question, or an approval.
                needs_confirm: false
                token: null
                stale: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      externalDocs:
        description: See this call in the Clearwake console
        url: https://clearwake-console.onrender.com/console
  /console/api/voice/transcribe:
    post:
      tags:
      - Voice
      operationId: transcribeVoice
      summary: Turn a recording into text on this machine
      description: The body is the recording itself (audio, or webm or mp4 video, at most 5 MB and 30 seconds), not JSON. A local Whisper model reads it; the audio is deleted when the call ends and only its SHA-256 is kept. The returned `transcript_id` goes to `voiceTurn`.
      security: *id002
      requestBody:
        required: true
        description: The recording as it came from the browser.
        content:
          audio/webm:
            schema:
              type: string
              format: binary
              description: The recorded audio bytes.
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: The recorded audio bytes.
      responses:
        '200':
          description: The transcript and its hashes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcription'
        '400':
          description: No audio arrived, or it was cut off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No audio arrived.
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: The recording is over 5 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The body is not audio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Speech to text is not installed on this server. Type instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
        description: See this call in the Clearwake console
        url: https://clearwake-console.onrender.com/console
components:
  securitySchemes:
    consoleSession:
      type: apiKey
      in: cookie
      name: clearwake_console
      description: Set by `GET /console/api/session`. HttpOnly, SameSite=Strict, 8 hours.
    csrfToken:
      type: apiKey
      in: header
      name: X-Clearwake-CSRF
      description: The `csrf` value from `GET /console/api/session`, an HMAC of the session id. Required on every POST.
  responses:
    BadRequest:
      description: The body is not valid (for example a request longer than 200 characters, or an unknown case key).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Choose one of the cases c, d, e, f, g, i, j, k, l, m, n or o.
    Forbidden:
      description: The origin is not the server's own, or the session or CSRF token is missing or stale. Reload the session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: This console session is missing or stale. Reload the page.
    NotFound:
      description: Unknown route, unknown reference, or the console is not configured on this server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: No case in this local run matches that reference.
    RateLimited:
      description: Hosted mode only (`CLEARWAKE_HOSTED=1`). Too many requests from this address in the last minute (reads 120, writes 20 by default, set by `CLEARWAKE_RATE_READ` and `CLEARWAKE_RATE_WRITE`). Wait the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          description: Whole seconds to wait.
          schema:
            type: integer
            minimum: 1
          example: 12
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The state does not allow it (for example an approval already decided, or a refund that is not UNKNOWN).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Negotiation:
      type: object
      required:
      - running
      - error
      - case
      - steps
      properties:
        running:
          type: boolean
          description: True while a negotiation is in progress.
          example: false
        error:
          type:
          - string
          - 'null'
          description: The failure text when the negotiation failed, otherwise null.
        case:
          type:
          - string
          - 'null'
          description: Dispute id of the finished case, when there is one.
          example: PP-D-REH-49D4D35C16
        steps:
          type: array
          items:
            type: object
            required:
            - n
            - step
            - action
            - ok
            - at
            properties:
              n:
                type: integer
                description: Step number, starting at 1.
                example: 1
              step:
                type: string
                description: The receipt step id, made of the dispute id and the step name.
                example: PP-D-REH-49D4D35C16:decision
              action:
                type: string
                description: The action id written on the receipt, or the action the agent took.
                example: clearwake.dispute.decision
              ok:
                type: boolean
                description: True when the step succeeded.
                example: true
              at:
                type: string
                description: UTC time of day, HH:MM:SS.
                example: 05:05:48
            description: One item of the list.
          description: The receipt steps of the negotiation, in the order they were written.
          example:
          - n: 1
            step: PP-D-REH-49D4D35C16:decision
            action: clearwake.dispute.decision
            ok: true
            at: 05:05:48
      description: State of the negotiation started by negotiate, with the receipt steps written so far.
    Total:
      type: object
      required:
      - value
      - label
      - source
      properties:
        value:
          type: string
          description: The measured number as text, with its unit.
          example: 5 of 10
        label:
          type: string
          description: How the data behind this response runs, for example local run data.
          example: local run data
        source:
          type: string
          description: The run file the number was built from.
      description: One measured number for the console header with the run file it came from.
    Session:
      type: object
      required:
      - csrf
      - label
      properties:
        csrf:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: 'The CSRF token: 64 lowercase hex characters. Send it as X-Clearwake-CSRF on every POST.'
          example: 4f1d0c2f9a7b6e8d3c5a1b0e9f8d7c6b5a4938271605f4e3d2c1b0a998877665
        label:
          type: string
          description: How the data behind the console runs, for example `local run data`.
          example: local run data
      description: The CSRF token and the data label returned when a session starts.
    Money:
      type: string
      pattern: ^(0|[1-9][0-9]{0,8})\.[0-9]{2}$
      description: A USD amount with two decimals.
    BuyRequest:
      type: object
      required:
      - request
      additionalProperties: false
      properties:
        request:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[\x20-\x7e]+$
          description: What the owner asked the buyer agent for, in plain printable characters.
          example: a pack of three A5 notebooks
      description: 'The body of buy: what the owner asked the buyer agent for.'
    CaseRequest:
      type: object
      required:
      - case
      additionalProperties: false
      properties:
        case:
          type: string
          enum:
          - c
          - d
          - e
          - f
          - g
          - i
          - j
          - k
          - l
          - m
          - n
          - o
          description: The case key (c to o) or the dispute id the row belongs to.
          example: n
      description: 'The body of runCase: the key of the case to run.'
    ApproveRequest:
      type: object
      required:
      - approval_id
      - approver
      additionalProperties: false
      properties:
        approval_id:
          type: string
          pattern: ^[0-9a-f-]{36}$
          description: The approval id from the inbox, a UUID.
          example: 00000000-0000-0000-0000-000000000000
        approver:
          type: string
          pattern: ^[A-Za-z][A-Za-z .'()-]{1,59}$
          description: The approver's name, 2 to 60 letters.
      description: 'The body of approve: which approval, and who approves.'
    ReconcileRequest:
      type: object
      required:
      - case_id
      additionalProperties: false
      properties:
        case_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          description: The case id as shown in the console, for example PP-D-REH-BE1428B853.
          example: PP-D-REH-BE1428B853
      description: 'The body of reconcile: the case whose UNKNOWN refund is read back from the provider.'
    ResetResult:
      type: object
      required:
      - ok
      - folder
      properties:
        ok:
          type: boolean
          description: True when the step succeeded.
          example: true
        wiped:
          type: boolean
          description: True in hosted mode, where a reset deletes the earlier run folders.
          example: false
        removed_folders:
          type: integer
          minimum: 0
          description: How many earlier run folders were deleted (hosted mode only, otherwise 0).
          example: 0
        folder:
          type: string
          pattern: ^run-[0-9]{8}-[0-9]{6}-[0-9a-f]{4}$
          description: The data folder of the run.
          example: run-20261111-104352-aecb
      description: 'The result of reset: the new run folder and what was deleted in hosted mode.'
    Purchase:
      type: object
      required:
      - at
      - request
      - allowed
      - reason
      - checks
      - price_minor
      properties:
        at:
          type: string
          format: date-time
          description: Time the record was written, UTC.
          example: '2026-11-11T07:17:29Z'
        request:
          type: string
          description: The request text as the owner sent it.
          example: a pack of three A5 notebooks
        model:
          type: string
          description: Which agent proposed it, for example `scripted, not AI` or a model label.
          example: scripted, not AI
        proposed:
          type: string
          description: The product id the agent proposed.
          example: notebook-a5
        note:
          type: string
          description: A short note from the agent or the checker, empty when there is none.
          example: ''
        allowed:
          type: boolean
          description: True when the check or policy allows the action.
          example: true
        reason:
          type: string
          description: Why it was allowed or refused, or the dispute reason code.
          example: Inside the mandate.
        checks:
          type: object
          description: Each mandate check by name, true when it passed.
          additionalProperties:
            type: boolean
            description: True when that check passed.
          example:
            merchant allowed: true
            category allowed: true
        product:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: The catalog product the agent proposed, or null when none matched.
          example:
            id: notebook-a5
            name: A5 dot grid notebook
            category: stationery
            price_minor: 900
        price_minor:
          type: integer
          minimum: 0
          description: Price in minor units (cents).
          example: 900
        spent_before_minor:
          type: integer
          minimum: 0
          description: Amount already spent under the mandate before this purchase, in minor units.
          example: 1800
        receipt:
          oneOf:
          - $ref: '#/components/schemas/MandateReceipt'
          - type: 'null'
            description: No value.
          description: The signed mandate receipt of an allowed purchase, or null.
        label:
          type: string
          description: How the data behind this response runs, for example local run data.
          example: local run data
      description: One purchase decision of the buyer agent with the mandate checks that decided it.
    MandateReceipt:
      type: object
      required:
      - order_id
      - digest
      - public_key
      - line
      - log_ok
      - log_lines
      properties:
        order_id:
          type: string
          description: The order id the receipt is linked to.
          example: ORDER-REH-5DA9909B
        digest:
          type: string
          description: SHA-256 digest of the receipt, 64 hex characters.
          example: 462b5031185079e4848005e9b01cf7ce5f26bbf71e448c5d27fabb2d0f1da084
        public_key:
          type: string
          description: The public key that verifies the signature, 64 hex characters.
          example: 38609034951b7475294bdfdf08e75f637d8bd34d0af36f4a85bb227dee94478a
        line:
          type: string
          description: The receipt exactly as written to the log.
        log_ok:
          type: boolean
          description: True when the whole receipt log still verifies.
          example: true
        log_lines:
          type: integer
          minimum: 1
          description: Number of receipts in the log.
          example: 3
      description: The signed mandate receipt written for an allowed purchase, with the log state.
    HistoryStep:
      type: object
      properties:
        at:
          type: string
          format: date-time
          description: Time the record was written, UTC.
          example: '2026-11-11T07:17:29Z'
        state:
          type: string
          description: The state of the case or row, for example VERIFIED, UNKNOWN or PENDING.
          example: PENDING
        action:
          type: string
          description: The action id written on the receipt, or the action the agent took.
          example: settle_by_offer
        detail:
          type: string
          description: A plain sentence saying what happened.
          example: Offer sent. PayPal shows WAITING_FOR_BUYER_RESPONSE; waiting for the buyer.
        note:
          type: string
          description: A short note from the agent or the checker, empty when there is none.
          example: ''
      description: One step in the history of a case entry.
    Entry:
      type: object
      description: One case as the console shows it. Dispute entries add the dispute fields.
      required:
      - id
      - key
      - run
      - title
      - kind
      - state
      - action
      - detail
      - history
      properties:
        id:
          type: string
          description: The case entry id, for dispute cases the dispute id.
          example: PP-D-REH-94816C42B4
        key:
          type: string
          enum:
          - c
          - d
          - e
          - f
          - g
          - i
          - j
          - k
          - l
          - m
          - n
          - o
          description: The case key, c to o.
          example: n
        run:
          type: string
          description: The run id of the case run, 6 characters.
          example: 38d215
        title:
          type: string
          description: The case title.
          example: 'Settle in conversation before escalation: offer inside the limit, PayPal record checked'
        at:
          type: string
          format: date-time
          description: Time the record was written, UTC.
          example: '2026-11-11T05:13:51Z'
        kind:
          type: string
          enum:
          - PayPal dispute
          - buyer complaint
          description: Whether the case is a PayPal dispute or a buyer complaint.
          example: PayPal dispute
        label:
          type: string
          description: How the data behind this response runs, for example local run data.
          example: local run data
        state:
          type: string
          description: VERIFIED, UNKNOWN, PENDING, MISMATCH, done, awaiting approval, refused, busy or held, offline.
          example: VERIFIED
        action:
          type: string
          description: The action id written on the receipt, or the action the agent took.
          example: settle_by_offer
        detail:
          type: string
          description: A plain sentence saying what happened.
          example: 'Settled at INQUIRY: PayPal shows RESOLVED (RESOLVED_WITH_PAYOUT) at the INQUIRY stage, never a claim.'
        refund_id:
          type:
          - string
          - 'null'
          description: The provider refund id, or null when no refund was made.
        approval_id:
          type:
          - string
          - 'null'
          description: The approval id from the inbox, a UUID.
        proposed:
          type:
          - string
          - 'null'
          description: What the model proposed. The policy decides, not the model.
          example: settle_by_offer
        model:
          type:
          - string
          - 'null'
          description: Which agent proposed the action, for example scripted, not AI, or a model label.
          example: scripted, not AI
        decided:
          type: string
          description: What the policy decided.
          example: settle_by_offer
        offer:
          description: The settlement offer, when the policy chose one.
        dispatch:
          description: The dispatch proof the evidence step found, when there was one.
        claim:
          description: The buyer's claim as checked against the record.
        dispute_id:
          type: string
          description: The dispute id.
          example: PP-D-REH-94816C42B4
        amount_minor:
          type: integer
          description: The disputed amount in minor units (cents).
          example: 250
        reason:
          type: string
          description: Why it was allowed or refused, or the dispute reason code.
          example: MERCHANDISE_OR_SERVICE_NOT_AS_DESCRIBED
        deadline:
          description: The seller response deadline and its state.
          example: *id003
        policy:
          $ref: '#/components/schemas/PolicyView'
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryStep'
          description: The steps of the case in the order they happened.
          example: *id004
      additionalProperties: true
    PolicyView:
      type: object
      required:
      - allowed
      - needs_approval
      - reason
      properties:
        allowed:
          type: boolean
          description: True when the check or policy allows the action.
          example: true
        needs_approval:
          type: boolean
          description: True when a named person must approve before the agent acts.
          example: false
        reason:
          type: string
          description: Why it was allowed or refused, or the dispute reason code.
          example: Inside the mandate.
        limit:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
            description: No value.
          description: The policy limit that applied, in USD, or null.
      description: 'What the policy file decided for a case: allowed, needs approval, and why.'
    CaseRun:
      type: object
      required:
      - key
      - run
      - label
      - entries
      properties:
        key:
          type: string
          description: The case key, c to o.
          example: n
        run:
          type: string
          description: The run id of the case run, 6 characters.
          example: 38d215
        label:
          type: string
          description: How the data behind this response runs, for example local run data.
          example: local run data
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
          description: The case entries.
      description: The entries one case run produced, with the run id.
    DisputeRow:
      type: object
      description: One row of the AG Grid dispute ledger. `stage` and `paypal_status` are read from the provider record now.
      required:
      - dispute
      - case
      - reason
      - amount
      - stage
      - paypal_status
      - decided
      - state
      - settled_before_escalation
      - fee_avoided
      properties:
        dispute:
          type: string
          description: The dispute id.
          example: PP-D-REH-94816C42B4
        case:
          type: string
          description: The case key (c to o) or the dispute id the row belongs to.
          example: n
        reason:
          type: string
          description: Why it was allowed or refused, or the dispute reason code.
          example: MERCHANDISE_OR_SERVICE_NOT_AS_DESCRIBED
        amount:
          $ref: '#/components/schemas/Money'
        stage:
          type: string
          description: INQUIRY, CHARGEBACK and so on, or `not given`.
          example: INQUIRY
        paypal_status:
          type: string
          description: The provider's status, or `unreadable`.
          example: RESOLVED
        decided:
          type: string
          description: What the policy decided.
          example: settle_by_offer
        proposed:
          type: string
          description: What the agent proposed. The policy decides, not the agent.
          example: settle_by_offer
        model:
          type: string
          description: Which agent proposed the action, for example scripted, not AI, or a model label.
          example: scripted, not AI
        state:
          type: string
          description: The state of the case or row, for example VERIFIED, UNKNOWN or PENDING.
          example: VERIFIED
        due:
          type:
          - string
          - 'null'
          description: The seller response deadline, or null.
        dispatch:
          description: The dispatch proof summary, or `none`.
        settled_before_escalation:
          type: boolean
          description: True only when the provider record reads RESOLVED at the INQUIRY stage.
          example: true
        fee_avoided:
          $ref: '#/components/schemas/Money'
        source:
          type: string
          description: Where the row was read from.
    LedgerRow:
      type: object
      required:
      - at
      - case
      - movement
      - amount
      - currency
      - state
      properties:
        at:
          type: string
          format: date-time
          description: Time the record was written, UTC.
          example: '2026-11-11T05:13:51Z'
        case:
          type: string
          description: The case key (c to o) or the dispute id the row belongs to.
          example: n
        movement:
          type: string
          description: The kind of money movement, for example a refund.
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          enum:
          - USD
          description: The currency code. Only USD is used.
          example: USD
        record:
          type: string
          description: The provider record id the movement was read from.
        state:
          type: string
          description: The state of the case or row, for example VERIFIED, UNKNOWN or PENDING.
          example: VERIFIED
        source:
          type: string
          description: Where the row was read from.
      description: 'One row of the money ledger: a movement tied to a case and a provider record.'
    InboxRow:
      type: object
      required:
      - id
      - operation
      - action
      - amount
      - currency
      - status
      properties:
        id:
          type: string
          description: The approval id, a UUID.
        operation:
          type: string
          description: The operation the approval is for.
        action:
          type: string
          description: The action id written on the receipt, or the action the agent took.
        subject:
          type: string
          description: What the approval is about, for example a capture id.
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          description: The currency code. Only USD is used.
          example: USD
        limit:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
            description: No value.
          description: The policy limit that applied, in USD, or null.
        requested_by:
          type: string
          description: Who or what asked for the approval.
        requested_at:
          type: number
          description: Unix time in seconds.
        expires_at:
          type: number
          description: Unix time in seconds.
        status:
          type: string
          description: PENDING, APPROVED or another store state, upper case.
        expired:
          type: boolean
          description: True when the approval has passed its expiry time.
          example: false
        approver:
          type:
          - string
          - 'null'
          description: The name of the person who approved, or null.
        case:
          type:
          - string
          - 'null'
          description: The case key (c to o) or the dispute id the row belongs to.
        key:
          type:
          - string
          - 'null'
          description: The case key, c to o.
      description: One approval in the approval inbox with its status and expiry.
    State:
      type: object
      required:
      - label
      - mode
      - folder
      - model
      - mandate
      - catalog
      - purchases
      - policy
      - cases
      - entries
      - runs
      - inbox
      - ledger
      - disputes
      - fees
      - now
      properties:
        label:
          type: string
          description: How the data behind this response runs, for example local run data.
          example: local run data
        mode:
          type: string
          description: The run mode line shown on the console.
          example: local
        folder:
          type: string
          description: The data folder of the run.
          example: run-20261111-104352-aecb
        model:
          type: string
          description: Which agents run, for example `scripted, not AI`.
          example: scripted, not AI
        network:
          type: string
          description: The network statement shown on the console.
          example: 'none: local provider, no provider calls'
        mandate:
          type: object
          properties:
            owner:
              type: string
              description: The mandate owner's name.
              example: Local run shopper
            budget:
              $ref: '#/components/schemas/Money'
            per_item_cap:
              $ref: '#/components/schemas/Money'
            merchants:
              type: array
              items:
                type: string
                description: One item of the list.
              description: The stores the mandate allows.
              example: *id005
            categories:
              type: array
              items:
                type: string
                description: One item of the list.
              description: The product categories the mandate allows.
              example: *id006
            currency:
              type: string
              description: The currency code. Only USD is used.
              example: USD
            spent:
              $ref: '#/components/schemas/Money'
            remaining:
              $ref: '#/components/schemas/Money'
          description: The buyer's signed mandate with what is spent and what remains.
        merchant:
          type: object
          additionalProperties: true
          description: The merchant's settings as the console shows them.
        catalog:
          type: array
          items:
            type: object
            additionalProperties: true
            description: One item of the list.
          description: The product catalog the buyer agent chooses from.
        purchases:
          type: array
          items:
            $ref: '#/components/schemas/Purchase'
          description: The purchase decisions of this run.
        policy:
          type: object
          properties:
            refund_max:
              $ref: '#/components/schemas/Money'
            approval_above:
              $ref: '#/components/schemas/Money'
            per_customer_per_day:
              $ref: '#/components/schemas/Money'
            hash:
              type: string
              description: Hash of the policy file the agent was held to.
              example: 396af6170103c7e2570b7c4f159e18543160e14127a05f873135a366bd7af271
          description: The refund policy limits in force, with the hash of the policy file.
        cases:
          type: array
          items:
            type: object
            required:
            - key
            - title
            - dispute
            properties:
              key:
                type: string
                description: The case key, c to o.
                example: c
              title:
                type: string
                description: The case title.
                example: Refund under the limit, checked against the provider record
              dispute:
                type: boolean
                description: True when the case is a PayPal dispute.
                example: true
            description: One item of the list.
          description: The cases the console can run.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
          description: The case entries.
        runs:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: The case key, c to o.
                example: n
              run:
                type: string
                description: The run id of the case run, 6 characters.
                example: 38d215
              at:
                type: string
                description: Time the record was written, UTC.
                example: '2026-11-11T05:13:51Z'
              title:
                type: string
                description: The case title.
                example: Settle in conversation before escalation
              states:
                type: array
                items:
                  type: string
                  description: One item of the list.
                description: The states each run reached.
              seconds:
                type: number
                description: Seconds the run took.
                example: 9.5
            description: One item of the list.
          description: The earlier runs of each case with their states and durations.
        inbox:
          type: array
          items:
            $ref: '#/components/schemas/InboxRow'
          description: The approval inbox.
        ledger:
          type: object
          properties:
            rows:
              type: array
              items:
                $ref: '#/components/schemas/LedgerRow'
              description: The ledger rows.
            provider_refunds:
              type: integer
              description: The number of refunds the provider holds for this run.
              example: 0
          description: The money ledger.
        gauge:
          type: object
          additionalProperties: true
          description: The fee gauge values.
        disputes:
          type: array
          items:
            $ref: '#/components/schemas/DisputeRow'
          description: The dispute ledger rows.
        fees:
          type: object
          additionalProperties: true
          description: The fee leak gauge computed from the run's own records.
        now:
          type: string
          format: date-time
          description: Server time, UTC.
          example: '2026-11-11T05:13:51Z'

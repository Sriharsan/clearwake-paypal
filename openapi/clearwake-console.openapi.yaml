            - after
            - changed
            description: One rule before and after.
            properties:
              field:
                type: string
                description: Rule name.
              before:
                type: string
                description: Value in force now.
              after:
                type: string
                description: Value if confirmed.
              changed:
                type: boolean
                description: True when the value differs.
        sentence_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 of the sentence.
        rules_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Hash of the rules. Send it to confirmRules.
        model:
          type: string
          description: Reader that produced the rules.
        backend:
          type: string
          description: Backend name.
        latency_ms:
          type: integer
          description: Milliseconds taken, or -1 for the rule parser.
        attempts:
          type: integer
          description: Attempts made.
    RulesConfirmRequest:
      type: object
      required:
      - rules_hash
      additionalProperties: false
      description: The rules to confirm.
      properties:
        role:
          type: string
          enum:
          - merchant
          - buyer
          default: merchant
          description: Whose rules.
        rules_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: The hash returned by proposeRules.
    RulesConfirmed:
      type: object
      required:
      - role
      - rules_hash
      - source
      additionalProperties: true
      description: The rules are signed and in force.
      properties:
        role:
          type: string
          description: Whose rules.
        rules_hash:
          type: string
          description: Hash of the confirmed rules.
        policy_hash:
          type: string
          description: Hash of the policy file now in force (merchant).
        previous_kept:
          type: boolean
          description: True when the earlier rules were kept on record.
        source:
          type: string
          description: typed or voice.
    VoiceStatus:
      type: object
      required:
      - stt
      - typing
      additionalProperties: true
      description: What voice input this server offers.
      properties:
        stt:
          type: boolean
          description: True when speech to text is available.
        model:
          type: string
          description: Speech model name.
        ffmpeg:
          type: boolean
          description: True when ffmpeg is present.
        model_present:
          type: boolean
          description: True when the model files are installed.
        max_seconds:
          type: integer
          description: Longest recording.
        max_bytes:
          type: integer
          description: Largest recording.
        label:
          type: string
          description: Plain statement of where speech is read.
        tts:
          type: string
          description: Where spoken answers come from.
        typing:
          type: boolean
          description: 'True: typing always works.'
        intents:
          type: array
          items:
            type: string
            description: One intent name.
          description: Intents the assistant understands.
    VoiceTurnRequest:
      type: object
      additionalProperties: false
      description: Send text or a transcript id.
      properties:
        text:
          type: string
          maxLength: 500
          description: Typed text.
        transcript_id:
          type: string
          description: Id returned by transcribeVoice.
    VoiceAnswerRequest:
      type: object
      required:
      - answer
      additionalProperties: false
      description: A Yes or No tap.
      properties:
        token:
          type: string
          description: Token of the open question.
        answer:
          type: string
          enum:
          - 'yes'
          - 'no'
          description: The answer.
    VoiceReply:
      type: object
      required:
      - intent
      - text
      - speak
      - needs_confirm
      additionalProperties: true
      description: One answer from the assistant. The text shown is the text spoken.
      properties:
        intent:
          type: string
          description: 'What was understood: set_rules, ask, approve, yes, no or unclear.'
        source:
          type: string
          description: typed, voice or tap.
        transcript:
          type: string
          description: The words that were understood.
        transcript_sha256:
          type: string
          description: SHA-256 of those words.
        text:
          type: string
          description: The answer as shown.
        speak:
          type: string
          description: The answer as spoken; identical to text.
        needs_confirm:
          type: boolean
          description: True when a Yes or No is waited for.
        token:
          type:
          - string
          - 'null'
          description: Token to send to answerVoice when needs_confirm is true.
        how:
          type: string
          description: How the sentence was matched.
        stale:
          type: boolean
          description: True when the tapped question was no longer open.
        facts:
          type: object
          additionalProperties: true
          description: Numbers behind the answer.
        kind:
          type: string
          description: What the open question is about, for example rules.
        lines:
          type: array
          items:
            type: string
            description: One rule in words.
          description: The rules read back, when kind is rules.
        proposal:
          $ref: '#/components/schemas/RulesProposal'
    Transcription:
      type: object
      required:
      - transcript
      - transcript_id
      additionalProperties: true
      description: The text of a recording.
      properties:
        transcript:
          type: string
          description: The words heard.
        transcript_id:
          type: string
          description: Pass to voiceTurn.
        transcript_sha256:
          type: string
          description: SHA-256 of the transcript.
        audio_sha256:
          type: string
          description: SHA-256 of the audio, which is not kept.
        audio_seconds:
          type: number
          description: Length of the recording.
        ms:
          type: integer
          description: Milliseconds taken.
        model:
          type: string
          description: Model folder name.
        label:
          type: string
          description: Plain statement of where speech was read.
externalDocs:
  description: Open the Clearwake console, the page that calls this API.
  url: https://clearwake-console.onrender.com/console

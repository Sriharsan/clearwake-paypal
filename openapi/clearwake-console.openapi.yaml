  /console/api/buy:
    post:
      tags:
      - Buyer agent
      operationId: buy
      summary: Ask the buyer agent to buy something
      description: The agent proposes a product from the catalog; the mandate check (budget, per item cap, store, category) decides. An allowed purchase writes a signed mandate receipt linked to the order id.
      security:
      - consoleSession: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyRequest'
            example:
              request: a pack of three A5 notebooks
        description: What the owner asked the buyer agent to buy.
      responses:
        '200':
          description: The purchase decision, allowed or refused, with the checks that decided it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
              example:
                at: '2026-11-11T05:13:51Z'
                request: a pack of three A5 notebooks
                model: scripted, not AI
                proposed: notebook-a5
                note: ''
                allowed: true
                reason: Inside the mandate.
                checks:
                  merchant allowed: true
                  category allowed: true
                  currency matches: true
                  under per item cap: true
                  inside remaining budget: true
                product:
                  id: notebook-a5
                  name: A5 dot grid notebook
                  category: stationery
                  price_minor: 900
                price_minor: 900
                spent_before_minor: 1800
                label: local run data
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':

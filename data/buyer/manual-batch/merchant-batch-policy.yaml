# Merchant autonomy policy. Read by the server, never by a model. Its hash is written into every receipt.
# Amounts are in cents. A prompt, a buyer message or a model reply cannot change anything here.
version: 1
operations:
  refund:
    level: Execute within Limits
    max_amount_minor: 500
    approval_above_minor: 200
    currency: USD
    retry: never
  accept_claim:
    level: Execute within Limits
    max_amount_minor: 500
    approval_above_minor: 200
    currency: USD
    retry: never
  provide_evidence:
    level: Execute within Limits
    retry: safe
  # Settling in conversation, before PayPal escalates the case to a claim. PayPal refunds an offer only if the buyer accepts it.
  make_offer:
    level: Execute within Limits
    max_amount_minor: 900
    approval_above_minor: 500
    currency: USD
    retry: never
  send_message:
    level: Execute within Limits
    retry: safe
  propose_resolution:
    level: Draft
    retry: never
caps:
  per_customer_per_day_minor: 900
# The only host the egress gateway lets agents reach.
egress:
  allow_hosts:
    - api-m.sandbox.paypal.com

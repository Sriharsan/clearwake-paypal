<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Clearwake</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/__video/endcard.css">
</head><body>
<main class="end">
  <p class="eyebrow">Real PayPal sandbox run, 11 November 2026</p>
  <h1>When an agent's order goes missing, agents fix it.</h1>
  <div class="nums">
    <div class="n"><b class="tnum" id="n1">{{n1}}</b><span>{{l1}}</span></div>
    <div class="n"><b class="tnum" id="n2">{{n2}}</b><span>{{l2}}</span></div>
    <div class="n"><b class="tnum" id="n3">{{n3}}</b><span>{{l3}}</span></div>
  </div>
  <section class="q" data-quotes hidden><div data-quote-list></div></section>
  <pre class="cmd" id="cmd">{{command}}</pre>
  <p class="links"><span>{{console}}</span><span>{{github}}</span></p>
  <p class="foot">MIT. Sandbox only. No real money.</p>
</main>
<script src="/quotes.js" defer></script>
</body></html>
